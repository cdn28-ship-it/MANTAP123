<script>
(function () {
  "use strict";

  const DIRECT_LINK =
    "https://www.profitableratecpmnetwork.com/jqam5pwjs?key=759fb4084cc926a5cff7602a430c42af";

  const video = document.getElementById("mainVideo");
  const overlay = document.getElementById("continueOverlay");
  const continueButton = document.getElementById("continueButton");
  const fullscreenButton = document.getElementById("fullscreenButton");
  const videoBanner = document.getElementById("videoBanner");

  const TRIGGER_INTERVAL = 20;
  const MAX_TRIGGERS = 2;

  let triggerCount = 0;
  let watchedSeconds = 0;
  let triggerVisible = false;
  let waitingForReturn = false;
  let lastTick = null;

  // Hitung waktu menonton hanya saat video berjalan
  // dan halaman sedang terlihat.
  function updateTimer() {
    const now = performance.now();

    if (lastTick === null) {
      lastTick = now;
      return;
    }

    const elapsed = (now - lastTick) / 1000;
    lastTick = now;

    if (
      document.visibilityState === "visible" &&
      !video.paused &&
      !video.ended &&
      !triggerVisible &&
      !waitingForReturn
    ) {
      watchedSeconds += Math.min(elapsed, 1);

      if (
        watchedSeconds >= TRIGGER_INTERVAL &&
        triggerCount < MAX_TRIGGERS
      ) {
        showTrigger();
      }
    }
  }

  function showTrigger() {
    if (triggerCount >= MAX_TRIGGERS || triggerVisible) return;

    triggerVisible = true;
    video.pause();
    overlay.style.display = "flex";
    lastTick = performance.now();
  }

  function hideTrigger() {
    triggerVisible = false;
    overlay.style.display = "none";
  }

  // Klik tombol membuka Direct Link.
  // Trigger tidak membuka iklan secara otomatis.
  continueButton.addEventListener("click", function () {
    if (!triggerVisible || triggerCount >= MAX_TRIGGERS) return;

    triggerCount++;
    watchedSeconds = 0;
    waitingForReturn = true;

    hideTrigger();
    video.pause();

    // Dibuka langsung sebagai respons terhadap klik user.
    window.open(DIRECT_LINK, "_blank");

    // Jika halaman masih terlihat karena browser membuka
    // tab di latar belakang, video dapat dilanjutkan.
    // Jika halaman tersembunyi, tunggu user kembali.
    if (document.visibilityState === "visible") {
      waitingForReturn = false;
      lastTick = performance.now();
      video.play().catch(function () {});
    }
  });

  // Ketika user kembali ke tab video, lanjutkan pemutaran
  // dan mulai hitungan 20 detik berikutnya.
  document.addEventListener("visibilitychange", function () {
    lastTick = performance.now();

    if (
      document.visibilityState === "visible" &&
      waitingForReturn
    ) {
      waitingForReturn = false;
      hideTrigger();
      video.play().catch(function () {});
    }
  });

  // Cadangan untuk browser yang melaporkan perubahan fokus
  // tanpa perubahan visibility.
  window.addEventListener("focus", function () {
    lastTick = performance.now();

    if (waitingForReturn && !triggerVisible) {
      waitingForReturn = false;
      video.play().catch(function () {});
    }
  });

  video.addEventListener("play", function () {
    lastTick = performance.now();
  });

  video.addEventListener("pause", function () {
    lastTick = performance.now();
  });

  video.addEventListener("ended", function () {
    hideTrigger();
  });

  setInterval(updateTimer, 250);

  // Tombol layar penuh
  fullscreenButton.addEventListener("click", function () {
    if (video.requestFullscreen) {
      video.requestFullscreen().catch(function () {});
    } else if (video.webkitEnterFullscreen) {
      video.webkitEnterFullscreen();
    }
  });

  // Direct Link banner tetap menggunakan link yang sama.
  function openDirectLink() {
    window.open(DIRECT_LINK, "_blank");
  }

  videoBanner.addEventListener("click", openDirectLink);

  videoBanner.addEventListener("keydown", function (event) {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openDirectLink();
    }
  });
})();
</script>
